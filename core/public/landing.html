<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #06060e;
      --card: #10101e;
      --card-border: rgba(255, 255, 255, 0.06);
      --accent: #ff6b35;
      --accent-dim: rgba(255, 107, 53, 0.12);
      --text: #e8e8f0;
      --text-dim: #6a6a7a;
      --text-mid: #9a9aaa;
      --green: #4ade80;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 400px;
      width: 100%;
      padding: 24px;
      text-align: center;
    }

    /* Spear icon */
    .logo {
      margin-bottom: 32px;
    }
    .logo svg {
      width: 48px;
      height: 48px;
    }
    .spear-tip { fill: var(--accent); }
    .spear-line {
      stroke: var(--accent);
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    .title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -1px;
      color: var(--text);
      margin-bottom: 8px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--green);
      margin-bottom: 40px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Login area */
    .login-section {
      margin-bottom: 32px;
      min-height: 44px;
    }
    .login-section.ready .login-placeholder { display: none; }
    .login-placeholder {
      color: var(--text-dim);
      font-size: 0.8rem;
    }

    /* Token login */
    .token-form {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }
    .token-form input {
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--card);
      color: var(--text);
      font-size: 0.85rem;
      width: 200px;
      outline: none;
      transition: border-color 0.2s;
    }
    .token-form input:focus {
      border-color: rgba(255,107,53,0.3);
    }
    .token-form button {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      transition: opacity 0.2s;
    }
    .token-form button:hover { opacity: 0.9; }
    .token-error {
      color: #ff4444;
      font-size: 0.8rem;
      margin-top: 8px;
    }

    /* CTA */
    .cta-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 0.85rem;
      text-decoration: none;
      border-radius: 10px;
      transition: border-color 0.2s;
      margin-bottom: 32px;
    }
    .cta-link:hover {
      border-color: rgba(255,255,255,0.12);
    }

    .footer {
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: 48px;
    }
    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Logo -->
    <div class="logo">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path class="spear-tip" d="M24 4 L30 18 L24 15 L18 18 Z" />
        <line class="spear-line" x1="24" y1="15" x2="24" y2="42" />
        <circle cx="24" cy="42" r="2" fill="var(--accent)" opacity="0.3" />
      </svg>
    </div>

    <div class="title" id="title">Vel</div>
    <div class="status">
      <span class="status-dot"></span>
      Running
    </div>

    <!-- Telegram login -->
    <div class="login-section" id="tg-login-area">
      <div id="tg-login-placeholder" class="login-placeholder">⏳ Loading...</div>
    </div>

    <!-- Token login (hidden by default) -->
    <div class="login-section hidden" id="token-login-area">
      <form class="token-form" id="token-login-form">
        <input type="password" id="token-input" placeholder="Access token" />
        <button type="submit">Login</button>
      </form>
      <div id="token-error" class="token-error hidden"></div>
    </div>

    <!-- Telegram link -->
    <a class="cta-link hidden" id="tg-link" href="#">
      💬 <span id="tg-link-text">Open in Telegram</span>
    </a>

    <div class="footer">
      powered by <a href="https://github.com/essdee/vel">vel</a>
    </div>
  </div>

  <script>
    // Mini App auto-redirect
    if (window.Telegram?.WebApp?.initData) {
      fetch('/api/auth', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({initData: window.Telegram.WebApp.initData})
      }).then(r => r.json()).then(data => {
        if (data.ok) window.location.href = '/dashboard';
      }).catch(() => {});
    }

    // Dev mode
    fetch('/api/mode').then(r => r.json()).then(m => {
      if (m.testMode) window.location.href = '/auth/dev';
    }).catch(() => {});

    // Load config
    fetch('/api/config').then(r => r.json()).then(cfg => {
      // Accent color
      if (cfg.accent) {
        document.documentElement.style.setProperty('--accent', cfg.accent);
      }

      // Title
      if (cfg.name) {
        document.getElementById('title').textContent = cfg.name;
        document.title = cfg.name + (cfg.emoji ? ' ' + cfg.emoji : '');
      }

      // Auth mode
      const authMode = cfg.authMode || 'telegram';

      if (authMode === 'none') {
        document.getElementById('tg-login-placeholder').textContent = '';
        window.location.href = '/dashboard';
      } else if (authMode === 'token') {
        document.getElementById('tg-login-area').classList.add('hidden');
        document.getElementById('token-login-area').classList.remove('hidden');
        document.getElementById('token-login-form').addEventListener('submit', function(e) {
          e.preventDefault();
          const token = document.getElementById('token-input').value;
          fetch('/auth/token', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({token: token})
          }).then(r => r.json()).then(res => {
            if (res.ok) {
              window.location.href = '/dashboard';
            } else {
              const err = document.getElementById('token-error');
              err.textContent = 'Invalid token';
              err.classList.remove('hidden');
            }
          }).catch(() => {
            const err = document.getElementById('token-error');
            err.textContent = 'Login failed';
            err.classList.remove('hidden');
          });
        });
      } else if (cfg.botUsername && cfg.authUrl) {
        // Telegram login widget
        const loginArea = document.getElementById('tg-login-area');
        const script = document.createElement('script');
        script.async = true;
        script.src = 'https://telegram.org/js/telegram-widget.js?22';
        script.dataset.telegramLogin = cfg.botUsername;
        script.dataset.size = 'large';
        script.dataset.radius = '12';
        script.dataset.authUrl = cfg.authUrl;
        script.dataset.requestAccess = 'write';
        loginArea.appendChild(script);

        function reveal() { loginArea.classList.add('ready'); }
        const observer = new MutationObserver(() => {
          if (loginArea.querySelector('iframe')) { observer.disconnect(); reveal(); }
        });
        observer.observe(loginArea, { attributes: true, subtree: true, attributeFilter: ['style'] });
        window.addEventListener('message', function handler(e) {
          if (e.origin === 'https://oauth.telegram.org') { window.removeEventListener('message', handler); reveal(); }
        });
        setTimeout(reveal, 4000);
      } else {
        document.getElementById('tg-login-placeholder').textContent = '';
      }

      // Telegram link
      if (cfg.telegramLink) {
        const link = document.getElementById('tg-link');
        link.classList.remove('hidden');
        link.href = cfg.telegramLink;
        if (cfg.name) {
          document.getElementById('tg-link-text').textContent = 'Talk to ' + cfg.name + ' on Telegram';
        }
      }
    }).catch(() => {
      document.getElementById('tg-login-placeholder').textContent = '';
    });
  </script>
</body>
</html>
