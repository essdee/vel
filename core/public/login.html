<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Login — Vel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #1e1e2e;
      --text: #e2e2e8;
      --text-dim: #6e6e82;
      --accent: #c9a84c;
      --accent-dim: rgba(201, 168, 76, 0.15);
      --green: #4ade80;
      --red: #f87171;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .bg-glow {
      position: fixed; top: -200px; left: 50%; transform: translateX(-50%);
      width: 600px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle, var(--accent-dim) 0%, transparent 70%);
      z-index: 0; opacity: 0.4;
    }
    .login-container {
      position: relative; z-index: 1;
      width: 100%; max-width: 400px; padding: 20px;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
    }
    .login-emoji {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .login-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .login-subtitle {
      color: var(--text-dim);
      font-size: 14px;
      margin-bottom: 32px;
    }
    .login-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      background: #0088cc;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    .login-btn:hover {
      background: #0077b5;
      transform: translateY(-1px);
    }
    .login-btn svg {
      width: 20px;
      height: 20px;
    }
    .login-status {
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-dim);
    }
    .login-status.error {
      color: var(--red);
    }
    .login-status.success {
      color: var(--green);
    }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid var(--text-dim);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #telegram-login-widget {
      margin-top: 16px;
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-emoji" id="login-emoji">🏹</div>
      <h1 class="login-title" id="login-title">Welcome</h1>
      <p class="login-subtitle">Sign in to access the dashboard</p>

      <div id="login-content">
        <!-- Filled by JavaScript -->
      </div>

      <div id="login-status" class="login-status"></div>
    </div>
  </div>

  <script>
    (function() {
      const tg = window.Telegram?.WebApp;
      const statusEl = document.getElementById('login-status');
      const contentEl = document.getElementById('login-content');

      // Get redirect target
      const params = new URLSearchParams(window.location.search);
      const redirect = params.get('redirect') || '/dashboard';

      // Load config for branding
      fetch('/api/config').then(r => r.json()).then(cfg => {
        if (cfg.emoji) document.getElementById('login-emoji').textContent = cfg.emoji;
        if (cfg.name) document.getElementById('login-title').textContent = cfg.name;
        if (cfg.accent) {
          document.documentElement.style.setProperty('--accent', cfg.accent);
          document.documentElement.style.setProperty('--accent-dim', cfg.accent + '22');
        }

        // If inside Telegram Mini App, auto-authenticate
        if (tg && tg.initData) {
          tg.ready();
          tg.expand();
          statusEl.innerHTML = '<span class="spinner"></span> Authenticating...';
          doAuth(tg.initData);
          return;
        }

        // Browser mode: show Telegram Login Widget
        if (cfg.botUsername) {
          showTelegramWidget(cfg.botUsername);
        } else {
          statusEl.className = 'login-status error';
          statusEl.textContent = 'No authentication method available.';
        }
      }).catch(() => {
        statusEl.className = 'login-status error';
        statusEl.textContent = 'Failed to load configuration.';
      });

      function doAuth(initData) {
        fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: initData })
        }).then(r => r.json()).then(data => {
          if (data.ok) {
            statusEl.className = 'login-status success';
            statusEl.textContent = 'Authenticated! Redirecting...';
            window.location.href = redirect;
          } else {
            statusEl.className = 'login-status error';
            statusEl.textContent = data.error || 'Authentication failed. Access denied.';
          }
        }).catch(() => {
          statusEl.className = 'login-status error';
          statusEl.textContent = 'Network error. Please try again.';
        });
      }

      function showTelegramWidget(botUsername) {
        // Telegram Login Widget callback
        window.onTelegramAuth = function(user) {
          statusEl.innerHTML = '<span class="spinner"></span> Verifying...';
          // Send login widget data to callback endpoint
          const qs = new URLSearchParams(user).toString();
          fetch('/auth/telegram/callback?' + qs, { redirect: 'manual' })
            .then(r => {
              // Callback sets cookie and redirects
              window.location.href = redirect;
            })
            .catch(() => {
              statusEl.className = 'login-status error';
              statusEl.textContent = 'Authentication failed.';
            });
        };

        // Create script element for Telegram Login Widget
        const script = document.createElement('script');
        script.async = true;
        script.src = 'https://telegram.org/js/telegram-widget.js?22';
        script.setAttribute('data-telegram-login', botUsername);
        script.setAttribute('data-size', 'large');
        script.setAttribute('data-radius', '12');
        script.setAttribute('data-onauth', 'onTelegramAuth(user)');
        script.setAttribute('data-request-access', 'write');

        const widgetDiv = document.createElement('div');
        widgetDiv.id = 'telegram-login-widget';
        widgetDiv.appendChild(script);
        contentEl.appendChild(widgetDiv);
      }
    })();
  </script>
</body>
</html>
