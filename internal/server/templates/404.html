<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Not Found | Vel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .brand {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
    }
    .container { text-align: center; padding: 2rem; }
    .code {
      font-size: 7rem;
      font-weight: 800;
      color: #1e1e1e;
      line-height: 1;
      margin-bottom: 1.25rem;
      letter-spacing: -4px;
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.6rem; color: #fff; }
    p { color: #666; margin-bottom: 2rem; font-size: 0.95rem; }
    .back {
      display: inline-block;
      padding: 0.6rem 1.25rem;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      color: #c0c0c0;
      text-decoration: none;
      font-size: 0.9rem;
      transition: background 0.15s, border-color 0.15s;
    }
    .back:hover { background: #242424; border-color: #3e3e3e; }
  </style>
</head>
<body>
  <a class="brand" href="/">⚡ Vel</a>
  <div class="container">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>This page doesn't exist.</p>
    <a class="back" href="/dashboard">← Back to Dashboard</a>
  </div>
</body>
</html>
